name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: contrib
          file: contrib/Dockerfile
          tags: sputnik-build
          load: true
          cache-from: type=gha
          # Pull requests only read the cache, so they cannot crowd it out.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
      # Formatting, analysis and tests, on the same toolchain as releases.
      - run: make -o image check
