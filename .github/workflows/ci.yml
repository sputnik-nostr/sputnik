name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pinned by digest like the actions, since the BuildKit daemon runs
          # every step of the image. Dependabot does not update it.
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: contrib
          file: contrib/Dockerfile
          tags: sputnik-build
          load: true
          cache-from: type=gha
          # Pull requests only read the cache, so they cannot crowd it out.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
      # Formatting, analysis and tests, on the same toolchain as releases.
      - run: make -o image check
