name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: sputnik-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
  linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package AppImage
        run: |
          set -euo pipefail
          APP=sputnik
          BUNDLE=build/linux/x64/release/bundle
          APPDIR=AppDir

          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUNDLE"/* "$APPDIR/usr/bin/"
          cp assets/icon/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/$APP.png"
          ln -s "usr/share/icons/hicolor/256x256/apps/$APP.png" "$APPDIR/$APP.png"

          cat > "$APPDIR/usr/share/applications/$APP.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Sputnik
          Exec=$APP
          Icon=$APP
          Categories=Network;
          EOF
          ln -s "usr/share/applications/$APP.desktop" "$APPDIR/$APP.desktop"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/sputnik" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run "$APPDIR" "$APP-x86_64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: sputnik-linux-appimage
          path: sputnik-x86_64.AppImage
