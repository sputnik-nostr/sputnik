name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # The signing secrets must exist only in this environment, whose deployment
    # branches are limited to master, so that only runs on master get them. A
    # copy at repository or organization level is available to every workflow
    # and branch, and is used in place of a missing one here. docs/RELEASING.md
    # lists the settings to check.
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pinned by digest like the actions, since the BuildKit daemon runs
          # every step of the image. Dependabot does not update it:
          # docs/RELEASING.md says how to.
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: contrib
          file: contrib/Dockerfile
          tags: sputnik-build
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The same pinned container as a local `make dist`, so both match.
      - run: make -o image dist
      - name: Sign APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: sputnik
        run: |
          set -euo pipefail
          if [[ -z $ANDROID_KEYSTORE_BASE64 ]]; then
            echo "No release key configured; leaving the APKs unsigned."
            exit 0
          fi
          keys="$RUNNER_TEMP/keys"
          mkdir -m 700 "$keys"
          trap 'rm -rf "$keys"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d >"$keys/release.jks"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            docker run --rm -e OWNER="$(id -u):$(id -g)" \
              -e KS_PASS -e KEY_PASS -e KEY_ALIAS \
              -v "$keys:/keys:ro" -v "$PWD/dist:/out" sputnik-build \
              sh -c 'apksigner sign \
                --ks /keys/release.jks --ks-key-alias "$KEY_ALIAS" \
                --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
                --v1-signing-enabled false --v4-signing-enabled false \
                --out "/out/sputnik-$0.apk" "/out/sputnik-$0-unsigned.apk" \
                && chown "$OWNER" "/out/sputnik-$0.apk"' "$abi"
          done
          # What can be installed. The unsigned APKs are in SHA256SUMS.unsigned.
          (cd dist && sha256sum sputnik-x86_64.AppImage sputnik-armeabi-v7a.apk \
            sputnik-arm64-v8a.apk sputnik-x86_64.apk >SHA256SUMS)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/sputnik-*.apk
            dist/sputnik-x86_64.AppImage
      # One unzipped artifact per installable file, named after the file.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/sputnik-x86_64.AppImage
          archive: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/sputnik-arm64-v8a.apk
          archive: false
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/sputnik-armeabi-v7a.apk
          archive: false
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/sputnik-x86_64.apk
          archive: false
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/SHA256SUMS
          archive: false
      # Only for comparing against a local `make dist`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sputnik-unsigned-apks
          path: |
            dist/sputnik-*-unsigned.apk
            dist/SHA256SUMS.unsigned
          compression-level: 0
