name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v7
        with:
          name: sputnik-android-apk-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: sputnik-android-apk-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: sputnik-android-apk-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          compression-level: 0
  linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # The same pinned container as a local `make dist`, so both match.
      - run: make dist
      - uses: actions/upload-artifact@v7
        with:
          name: sputnik-linux-appimage
          path: |
            dist/sputnik-x86_64.AppImage
            dist/SHA256SUMS
          compression-level: 0
